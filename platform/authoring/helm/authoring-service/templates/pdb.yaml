{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "authoring-service.fullname" . }}
  labels:
    {{- include "authoring-service.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "authoring-service.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: service
{{- end }}
