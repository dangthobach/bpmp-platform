apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "authoring-service.fullname" . }}
  labels:
    {{- include "authoring-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "authoring-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "authoring-service.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: service
      annotations:
        bpmp.dev/runtime-config-revision: {{ .Values.runtimeConfig.revision | quote }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        {{- toYaml .Values.topologySpread.constraints | nindent 8 }}
      {{- end }}
      containers:
        - name: authoring-service
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config
            - {{ printf "%s/%s" .Values.runtimeConfig.mountPath .Values.runtimeConfig.fileName | quote }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
              protocol: TCP
            - name: health
              containerPort: {{ .Values.service.healthPort }}
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: runtime-config
              mountPath: {{ .Values.runtimeConfig.mountPath | quote }}
              readOnly: true
      volumes:
        - name: runtime-config
          secret:
            secretName: {{ .Values.runtimeConfig.secretName | quote }}
            defaultMode: 0440
