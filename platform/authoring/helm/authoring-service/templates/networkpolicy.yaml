{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "authoring-service.fullname" . }}
  labels:
    {{- include "authoring-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "authoring-service.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: service
  policyTypes: [Ingress, Egress]
  ingress:
    {{- toYaml .Values.networkPolicy.ingress | nindent 4 }}
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "authoring-service.fullname" . }}-migration-egress
  labels:
    {{- include "authoring-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "authoring-service.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: migration
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    {{- toYaml .Values.networkPolicy.migrationEgress | nindent 4 }}
{{- end }}
