name: bpmp-broker-e2e

x-rust-build: &rust-build
  context: ../..
  dockerfile: platform/e2e/Dockerfile.rust

x-engine: &engine
  image: ${RUST_IMAGE:?set RUST_IMAGE}
  build: *rust-build
  restart: "no"
  environment:
    RUST_LOG: ${ENGINE_LOG_LEVEL:-info}
  volumes:
    - ./runtime:/runtime:ro
  depends_on:
    topic-init:
      condition: service_completed_successfully
    configuration-service:
      condition: service_healthy

services:
  fixture-generator:
    image: ${RUST_IMAGE:?set RUST_IMAGE}
    build: *rust-build
    entrypoint: ["/usr/local/bin/bpmp-e2e-fixtures"]
    command: ["--manifest", "/e2e/manifest.json", "--output", "/runtime"]
    volumes:
      - ./manifest.json:/e2e/manifest.json:ro
      - ./runtime:/runtime
    profiles: ["setup"]

  postgres:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:?set POSTGRES_PORT}:5432"
    volumes:
      - ./runtime/governance-service.sql:/docker-entrypoint-initdb.d/001-governance.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: ${REDIS_IMAGE:?set REDIS_IMAGE}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  redpanda:
    image: ${REDPANDA_IMAGE:?set REDPANDA_IMAGE}
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=0.0.0.0:9092
      - --advertise-kafka-addr=redpanda:9092
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 2s
      timeout: 2s
      retries: 45

  topic-init:
    image: ${REDPANDA_IMAGE:?set REDPANDA_IMAGE}
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command: ["bash /runtime/kafka-topics.sh"]
    volumes:
      - ./runtime:/runtime:ro

  otel-collector:
    image: ${OTEL_IMAGE:?set OTEL_IMAGE}
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro

  engine1:
    <<: *engine
    command: ["--config", "/runtime/engine-1.json"]
    volumes:
      - ./runtime:/runtime:ro
      - engine1-data:/data

  engine2:
    <<: *engine
    command: ["--config", "/runtime/engine-2.json"]
    volumes:
      - ./runtime:/runtime:ro
      - engine2-data:/data

  engine3:
    <<: *engine
    command: ["--config", "/runtime/engine-3.json"]
    volumes:
      - ./runtime:/runtime:ro
      - engine3-data:/data

  human-runtime:
    image: ${HUMAN_IMAGE:?set HUMAN_IMAGE}
    build:
      context: ../..
      dockerfile: platform/e2e/Dockerfile.human-runtime
    command: ["--config", "/runtime/human-runtime.json"]
    volumes:
      - ./runtime:/runtime:ro
    depends_on:
      postgres:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
      engine2:
        condition: service_started
      configuration-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:7202/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  configuration-service:
    image: ${CONFIGURATION_IMAGE:?set CONFIGURATION_IMAGE}
    build:
      context: ../..
      dockerfile: platform/e2e/Dockerfile.configuration-service
    command: ["--config", "/runtime/configuration-service.json"]
    volumes:
      - ./runtime:/runtime:ro
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --cert
        - /runtime/secrets/tls.pem
        - --key
        - /runtime/secrets/tls-key.pem
        - --cacert
        - /runtime/secrets/ca.pem
        - https://localhost:7301/readyz
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  projection-service:
    image: ${PROJECTION_IMAGE:?set PROJECTION_IMAGE}
    build:
      context: ../..
      dockerfile: platform/e2e/Dockerfile.projection-service
    command: ["--config", "/runtime/projection-service.json"]
    volumes:
      - ./runtime:/runtime:ro
    depends_on:
      postgres:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
      configuration-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:7402/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  cockpit-gateway:
    image: ${COCKPIT_GATEWAY_IMAGE:?set COCKPIT_GATEWAY_IMAGE}
    build:
      context: ../..
      dockerfile: platform/e2e/Dockerfile.cockpit-gateway
    command: ["--config", "/runtime/cockpit-gateway.json"]
    volumes:
      - ./runtime:/runtime:ro
    ports:
      - "${COCKPIT_GATEWAY_PORT:?set COCKPIT_GATEWAY_PORT}:7601"
    depends_on:
      topic-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:7602/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  cockpit-web:
    image: ${COCKPIT_WEB_IMAGE:?set COCKPIT_WEB_IMAGE}
    build:
      context: ../..
      dockerfile: platform/e2e/Dockerfile.cockpit-web
    volumes:
      - ./runtime/cockpit-web-config.json:/usr/share/nginx/html/config.json:ro
      - ./runtime/cockpit-web-nginx.conf:/etc/nginx/nginx.conf:ro
      - ./runtime:/runtime:ro
    ports:
      - "${COCKPIT_WEB_PORT:?set COCKPIT_WEB_PORT}:8080"
    depends_on:
      api-gateway:
        condition: service_healthy
      cockpit-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  key-lifecycle:
    image: nginx:1.29-alpine
    volumes:
      - ./runtime/key-lifecycle-nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 2s
      retries: 30

  governance-service:
    image: ${GOVERNANCE_IMAGE:?set GOVERNANCE_IMAGE}
    build:
      context: ../..
      dockerfile: platform/e2e/Dockerfile.governance-service
    command: ["--config", "/runtime/governance-service.json"]
    volumes:
      - ./runtime:/runtime:ro
    ports:
      - "${GOVERNANCE_PORT:?set GOVERNANCE_PORT}:7501"
    depends_on:
      postgres:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
      configuration-service:
        condition: service_healthy
      engine1:
        condition: service_started
      engine2:
        condition: service_started
      engine3:
        condition: service_started
      key-lifecycle:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:7502/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  api-gateway:
    image: ${GATEWAY_IMAGE:?set GATEWAY_IMAGE}
    build:
      context: ../..
      dockerfile: platform/e2e/Dockerfile.api-gateway
    command: ["--config", "/runtime/api-gateway.json"]
    volumes:
      - ./runtime:/runtime:ro
    ports:
      - "${GATEWAY_PORT:?set GATEWAY_PORT}:8443"
    depends_on:
      redis:
        condition: service_healthy
      human-runtime:
        condition: service_healthy
      engine2:
        condition: service_started
      configuration-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --cacert
        - /runtime/secrets/ca.pem
        - https://localhost:8443/readyz
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

volumes:
  engine1-data:
  engine2-data:
  engine3-data:
