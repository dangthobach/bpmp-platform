name: bpmp-broker-e2e

x-rust-build: &rust-build
  context: ../..
  dockerfile: platform/e2e/Dockerfile.rust

x-authz-build: &authz-build
  context: ../..
  dockerfile: platform/e2e/Dockerfile.authz-control-plane

x-engine: &engine
  image: ${RUST_IMAGE:?set RUST_IMAGE}
  build: *rust-build
  restart: "no"
  environment:
    RUST_LOG: ${ENGINE_LOG_LEVEL:-info}
  volumes:
    - ./runtime:/runtime:ro
  depends_on:
    topic-init:
      condition: service_completed_successfully
    configuration-service:
      condition: service_healthy

services:
  fixture-generator:
    image: ${RUST_IMAGE:?set RUST_IMAGE}
    build: *rust-build
    entrypoint: ["/usr/local/bin/bpmp-e2e-fixtures"]
    command: ["--manifest", "/e2e/manifest.json", "--output", "/runtime"]
    volumes:
      - ./manifest.json:/e2e/manifest.json:ro
      - ./runtime:/runtime
    profiles: ["setup"]

  postgres:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - ./runtime/governance-service.sql:/docker-entrypoint-initdb.d/001-governance.sql:ro
      - ./runtime/projection-schema.sql:/docker-entrypoint-initdb.d/002-projection-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 30

  authz-postgres:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: authz
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: ${REDIS_IMAGE:?set REDIS_IMAGE}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    command:
      - start-dev
      - --https-port=8443
      - --https-certificate-file=/runtime/secrets/keycloak-tls.pem
      - --https-certificate-key-file=/runtime/secrets/keycloak-tls-key.pem
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: https://localhost:14443
      KC_HOSTNAME_STRICT: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./runtime:/runtime:ro
      - ./runtime/keycloak-realm.json:/opt/keycloak/data/import/bpmp-e2e-realm.json:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:?set KEYCLOAK_PORT}:8443"

  redpanda:
    image: ${REDPANDA_IMAGE:?set REDPANDA_IMAGE}
    restart: "on-failure:3"
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=0.0.0.0:9092
      - --advertise-kafka-addr=redpanda:9092
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 2s
      timeout: 2s
      retries: 45

  topic-init:
    image: ${REDPANDA_IMAGE:?set REDPANDA_IMAGE}
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-ec"]
    command: ["bash /runtime/kafka-topics.sh"]
    volumes:
      - ./runtime:/runtime:ro

  otel-collector:
    image: ${OTEL_IMAGE:?set OTEL_IMAGE}
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro

  engine1:
    <<: *engine
    command: ["--config", "/runtime/engine-1.json"]
    volumes:
      - ./runtime:/runtime:ro
      - engine1-data:/data

  engine2:
    <<: *engine
    command: ["--config", "/runtime/engine-2.json"]
    volumes:
      - ./runtime:/runtime:ro
      - engine2-data:/data

  engine3:
    <<: *engine
    command: ["--config", "/runtime/engine-3.json"]
    volumes:
      - ./runtime:/runtime:ro
      - engine3-data:/data

  human-runtime:
    image: ${HUMAN_IMAGE:?set HUMAN_IMAGE}
    build:
      context: ../..
      dockerfile: platform/e2e/Dockerfile.human-runtime
    command: ["--config", "/runtime/human-runtime.json"]
    volumes:
      - ./runtime:/runtime:ro
    depends_on:
      postgres:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
      engine2:
        condition: service_started
      case-local:
        condition: service_healthy
      configuration-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:7202/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  configuration-service:
    image: ${CONFIGURATION_IMAGE:?set CONFIGURATION_IMAGE}
    build:
      context: ../..
      dockerfile: platform/e2e/Dockerfile.configuration-service
    command: ["--config", "/runtime/configuration-service.json"]
    volumes:
      - ./runtime:/runtime:ro
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --cert
        - /runtime/secrets/tls.pem
        - --key
        - /runtime/secrets/tls-key.pem
        - --cacert
        - /runtime/secrets/ca.pem
        - https://localhost:7301/readyz
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  projection-service:
    image: ${PROJECTION_IMAGE:?set PROJECTION_IMAGE}
    build:
      context: ../..
      dockerfile: platform/e2e/Dockerfile.projection-service
    command: ["--config", "/runtime/projection-service.json"]
    volumes:
      - ./runtime:/runtime:ro
    depends_on:
      postgres:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
      configuration-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:7402/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  cockpit-gateway:
    image: ${COCKPIT_GATEWAY_IMAGE:?set COCKPIT_GATEWAY_IMAGE}
    build:
      context: ../..
      dockerfile: platform/e2e/Dockerfile.cockpit-gateway
    command: ["--config", "/runtime/cockpit-gateway.json"]
    volumes:
      - ./runtime:/runtime:ro
    ports:
      - "127.0.0.1:${COCKPIT_GATEWAY_PORT:?set COCKPIT_GATEWAY_PORT}:7601"
    depends_on:
      topic-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:7602/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  cockpit-web:
    image: ${COCKPIT_WEB_IMAGE:?set COCKPIT_WEB_IMAGE}
    build:
      context: ../..
      dockerfile: platform/e2e/Dockerfile.cockpit-web
    volumes:
      - ./runtime/cockpit-web-config.json:/usr/share/nginx/html/config.json:ro
      - ./runtime/cockpit-web-nginx.conf:/etc/nginx/nginx.conf:ro
      - ./runtime:/runtime:ro
    ports:
      - "127.0.0.1:${COCKPIT_WEB_PORT:?set COCKPIT_WEB_PORT}:8080"
    depends_on:
      api-gateway:
        condition: service_healthy
      cockpit-gateway:
        condition: service_healthy
      authz-app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  key-lifecycle:
    image: nginx:1.29-alpine
    volumes:
      - ./runtime/key-lifecycle-nginx.conf:/etc/nginx/nginx.conf:ro
      - ./runtime:/runtime:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 2s
      retries: 30

  authz-migrate:
    image: ${AUTHZ_IMAGE:?set AUTHZ_IMAGE}
    build: *authz-build
    env_file: ./runtime/authz-server.env
    environment:
      AUTHZ_MIGRATE_ONLY: "true"
    depends_on:
      authz-postgres:
        condition: service_healthy

  authz-seed:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >-
        PGPASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
        psql -h authz-postgres -U ${POSTGRES_USER:?set POSTGRES_USER} -d authz
        --set ON_ERROR_STOP=1 --file /runtime/authz-seed.sql
    volumes:
      - ./runtime:/runtime:ro
    depends_on:
      authz-migrate:
        condition: service_completed_successfully

  authz-server:
    image: ${AUTHZ_IMAGE:?set AUTHZ_IMAGE}
    build: *authz-build
    env_file: ./runtime/authz-server.env
    volumes:
      - ./runtime:/runtime:ro
    depends_on:
      authz-seed:
        condition: service_completed_successfully
      key-lifecycle:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  authz-app:
    image: ${AUTHZ_IMAGE:?set AUTHZ_IMAGE}
    build: *authz-build
    entrypoint: ["/usr/local/bin/authz-app"]
    env_file: ./runtime/authz-app.env
    volumes:
      - ./runtime:/runtime:ro
    ports:
      - "127.0.0.1:${AUTHZ_APP_PORT:?set AUTHZ_APP_PORT}:9090"
    depends_on:
      authz-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:9090/health/ready"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  governance-service:
    image: ${GOVERNANCE_IMAGE:?set GOVERNANCE_IMAGE}
    build:
      context: ../..
      dockerfile: platform/e2e/Dockerfile.governance-service
    command: ["--config", "/runtime/governance-service.json"]
    volumes:
      - ./runtime:/runtime:ro
    ports:
      - "127.0.0.1:${GOVERNANCE_PORT:?set GOVERNANCE_PORT}:7501"
    depends_on:
      postgres:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
      configuration-service:
        condition: service_healthy
      engine1:
        condition: service_started
      engine2:
        condition: service_started
      engine3:
        condition: service_started
      key-lifecycle:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:7502/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  api-gateway:
    image: ${GATEWAY_IMAGE:?set GATEWAY_IMAGE}
    build:
      context: ../..
      dockerfile: platform/e2e/Dockerfile.api-gateway
    command: ["--config", "/runtime/api-gateway.json"]
    volumes:
      - ./runtime:/runtime:ro
    ports:
      - "127.0.0.1:${GATEWAY_PORT:?set GATEWAY_PORT}:8443"
    depends_on:
      redis:
        condition: service_healthy
      human-runtime:
        condition: service_healthy
      projection-service:
        condition: service_healthy
      engine2:
        condition: service_started
      configuration-service:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - curl
        - --fail
        - --silent
        - --show-error
        - --cacert
        - /runtime/secrets/ca.pem
        - https://localhost:8443/readyz
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 2s

  case-postgres:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: case_user
      POSTGRES_PASSWORD: case-e2e
      POSTGRES_DB: case_db
    networks: [case-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 30

  case-migrate:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >-
        PGPASSWORD=case-e2e psql -h case-postgres -U case_user -d case_db
        --set ON_ERROR_STOP=1 --command "CREATE TABLE IF NOT EXISTS case_schema_migrations
        (version text PRIMARY KEY, applied_at timestamptz NOT NULL DEFAULT now())";
        for migration in /migrations/001_case_foundation.sql /migrations/002_outbox_delivery.sql
        /migrations/003_case_search.sql /migrations/004_engine_event_inbox.sql; do
        version=$${migration##*/};
        if ! PGPASSWORD=case-e2e psql -h case-postgres -U case_user -d case_db -Atc
        "SELECT 1 FROM case_schema_migrations WHERE version='$$version'" | grep -q 1; then
        PGPASSWORD=case-e2e psql -h case-postgres -U case_user -d case_db
        --set ON_ERROR_STOP=1 --single-transaction --file "$$migration";
        PGPASSWORD=case-e2e psql -h case-postgres -U case_user -d case_db
        --set ON_ERROR_STOP=1 --command "INSERT INTO case_schema_migrations(version)
        VALUES ('$$version')"; fi; done
    volumes:
      - ../../db/case-service/migrations:/migrations:ro
    networks: [case-data]
    depends_on:
      case-postgres:
        condition: service_healthy

  case-topic-init:
    image: ${REDPANDA_IMAGE:?set REDPANDA_IMAGE}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >-
        rpk topic create bpmp.case.events.v1.e2e --brokers redpanda:9092
        --partitions 1 --replicas 1 ||
        rpk topic describe bpmp.case.events.v1.e2e --brokers redpanda:9092
        >/dev/null
    networks: [default]
    depends_on:
      redpanda:
        condition: service_healthy

  case-local:
    image: bpmp/e2e-case-service:local
    build:
      context: ../..
      dockerfile: platform/e2e/Dockerfile.case-service
    command: ["--listen", "0.0.0.0:8085"]
    environment:
      CASE_LOCAL_POSTGRES_DSN: postgres://case_user:case-e2e@case-postgres:5432/case_db?sslmode=disable
      CASE_ACTOR_PROOF_KEY_ID: internal-actor-v1
      CASE_ACTOR_PROOF_PUBLIC_KEY: /runtime/secrets/internal-actor-public.key
      CASE_ACTOR_WORKLOAD_ID: case-service
      CASE_SERVER_CERTIFICATE: /runtime/secrets/tls.pem
      CASE_SERVER_PRIVATE_KEY: /runtime/secrets/tls-key.pem
      CASE_CLIENT_CA: /runtime/secrets/ca.pem
    volumes:
      - ./runtime:/runtime:ro
    networks: [default, case-data]
    depends_on:
      case-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--cacert", "/runtime/secrets/ca.pem", "--cert", "/runtime/secrets/tls.pem", "--key", "/runtime/secrets/tls-key.pem", "--resolve", "api-gateway:8085:127.0.0.1", "https://api-gateway:8085/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  case-outbox:
    image: bpmp/e2e-case-service:local
    build:
      context: ../..
      dockerfile: platform/e2e/Dockerfile.case-service
    entrypoint: ["/usr/local/bin/case-outbox"]
    command: ["--config", "/runtime/case-outbox-e2e.json"]
    volumes:
      - ./case-outbox-e2e.json:/runtime/case-outbox-e2e.json:ro
    networks: [default, case-data]
    depends_on:
      case-migrate:
        condition: service_completed_successfully
      case-topic-init:
        condition: service_completed_successfully

  case-start:
    image: bpmp/e2e-case-service:local
    build:
      context: ../..
      dockerfile: platform/e2e/Dockerfile.case-service
    entrypoint: ["/usr/local/bin/case-start"]
    command: ["--config", "/runtime/case-start-e2e.json"]
    volumes:
      - ./runtime:/runtime:ro
    networks: [default, case-data]
    depends_on:
      case-migrate:
        condition: service_completed_successfully
      authz-server:
        condition: service_healthy
      engine2:
        condition: service_started

  case-engine-events:
    image: bpmp/e2e-case-service:local
    build:
      context: ../..
      dockerfile: platform/e2e/Dockerfile.case-service
    entrypoint: ["/usr/local/bin/case-engine-events"]
    command: ["--config", "/runtime/case-engine-events-e2e.json"]
    volumes:
      - ./case-engine-events-e2e.json:/runtime/case-engine-events-e2e.json:ro
    networks: [default, case-data]
    depends_on:
      case-migrate:
        condition: service_completed_successfully
      topic-init:
        condition: service_completed_successfully

  ods-shell:
    image: bpmp/e2e-ods-dev:local
    build:
      context: ../..
      dockerfile: platform/e2e/Dockerfile.ods-dev
    command: ["npm", "run", "dev", "-w", "@ods/shell", "--", "--host", "0.0.0.0"]
    environment:
      ODS_API_TARGET: https://api-gateway:8443
      ODS_CASE_API_TARGET: https://api-gateway:8443
      ODS_REALTIME_TARGET: https://api-gateway:8443
    ports:
      - "127.0.0.1:4300:4300"
    networks: [default, case-preview]
    depends_on:
      task-mfe-dev:
        condition: service_started
      case-mfe-dev:
        condition: service_started
      document-mfe-dev:
        condition: service_started
      integration-mfe-dev:
        condition: service_started
      admin-mfe-dev:
        condition: service_started
      monitoring-mfe-dev:
        condition: service_started

  task-mfe-dev:
    image: bpmp/e2e-ods-dev:local
    build:
      context: ../..
      dockerfile: platform/e2e/Dockerfile.ods-dev
    command: ["npm", "run", "dev", "-w", "@ods/task-mfe", "--", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:4301:4301"
    networks: [default]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4301/mf-manifest.json').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30

  case-mfe-dev:
    image: bpmp/e2e-ods-dev:local
    build:
      context: ../..
      dockerfile: platform/e2e/Dockerfile.ods-dev
    command: ["npm", "run", "dev", "-w", "@ods/case-mfe", "--", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:4303:4303"
    networks: [case-preview]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4303/mf-manifest.json').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30

  # ---- Phase 4 & 5 isolated data stores, migrations, Kafka topics, mTLS services & MFEs ----

  ods-phase45-topic-init:
    image: ${REDPANDA_IMAGE:?set REDPANDA_IMAGE}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >-
        for topic in bpmp.document.events.v1.e2e bpmp.integration.events.v1.e2e bpmp.mdm.events.v1.e2e; do
          rpk topic create "$$topic" --brokers redpanda:9092 --partitions 1 --replicas 1 ||
          rpk topic describe "$$topic" --brokers redpanda:9092 >/dev/null;
        done
    networks: [default]
    depends_on:
      redpanda:
        condition: service_healthy

  document-postgres:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: document_user
      POSTGRES_PASSWORD: document-e2e
      POSTGRES_DB: document_db
    networks: [document-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 30

  document-migrate:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >-
        PGPASSWORD=document-e2e psql -h document-postgres -U document_user -d document_db
        --set ON_ERROR_STOP=1 --file /migrations/001_document_adapter.sql
    volumes:
      - ../../db/document-adapter/migrations:/migrations:ro
    networks: [document-data]
    depends_on:
      document-postgres:
        condition: service_healthy

  document-adapter:
    image: bpmp/e2e-ods-phase45:local
    build:
      context: ../..
      dockerfile: platform/e2e/Dockerfile.ods-phase45
    entrypoint: ["/usr/local/bin/document-adapter"]
    environment:
      DOCUMENT_ADAPTER_ADDR: 0.0.0.0:8084
      DOCUMENT_POSTGRES_DSN: postgres://document_user:document-e2e@document-postgres:5432/document_db?sslmode=disable
      DOCUMENT_KAFKA_BROKERS: redpanda:9092
      DOCUMENT_KAFKA_TOPIC: bpmp.document.events.v1.e2e
      DOCUMENT_SERVER_CERTIFICATE: /runtime/secrets/tls.pem
      DOCUMENT_SERVER_PRIVATE_KEY: /runtime/secrets/tls-key.pem
      DOCUMENT_CLIENT_CA: /runtime/secrets/ca.pem
    volumes:
      - ./runtime:/runtime:ro
    networks: [default, document-data]
    depends_on:
      document-migrate:
        condition: service_completed_successfully
      ods-phase45-topic-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--cacert", "/runtime/secrets/ca.pem", "--cert", "/runtime/secrets/tls.pem", "--key", "/runtime/secrets/tls-key.pem", "--resolve", "api-gateway:8084:127.0.0.1", "https://api-gateway:8084/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30

  integration-postgres:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: integration_user
      POSTGRES_PASSWORD: integration-e2e
      POSTGRES_DB: integration_db
    networks: [integration-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 30

  integration-migrate:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >-
        PGPASSWORD=integration-e2e psql -h integration-postgres -U integration_user -d integration_db
        --set ON_ERROR_STOP=1 --file /migrations/001_integration_hub.sql
    volumes:
      - ../../db/integration-hub/migrations:/migrations:ro
    networks: [integration-data]
    depends_on:
      integration-postgres:
        condition: service_healthy

  integration-hub:
    image: bpmp/e2e-ods-phase45:local
    build:
      context: ../..
      dockerfile: platform/e2e/Dockerfile.ods-phase45
    entrypoint: ["/usr/local/bin/integration-hub"]
    environment:
      INTEGRATION_HUB_ADDR: 0.0.0.0:8088
      INTEGRATION_POSTGRES_DSN: postgres://integration_user:integration-e2e@integration-postgres:5432/integration_db?sslmode=disable
      INTEGRATION_KAFKA_BROKERS: redpanda:9092
      INTEGRATION_KAFKA_TOPIC: bpmp.integration.events.v1.e2e
      INTEGRATION_SERVER_CERTIFICATE: /runtime/secrets/tls.pem
      INTEGRATION_SERVER_PRIVATE_KEY: /runtime/secrets/tls-key.pem
      INTEGRATION_CLIENT_CA: /runtime/secrets/ca.pem
    volumes:
      - ./runtime:/runtime:ro
    networks: [default, integration-data]
    depends_on:
      integration-migrate:
        condition: service_completed_successfully
      ods-phase45-topic-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--cacert", "/runtime/secrets/ca.pem", "--cert", "/runtime/secrets/tls.pem", "--key", "/runtime/secrets/tls-key.pem", "--resolve", "api-gateway:8088:127.0.0.1", "https://api-gateway:8088/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30

  mdm-postgres:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: mdm_user
      POSTGRES_PASSWORD: mdm-e2e
      POSTGRES_DB: mdm_db
    networks: [mdm-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 2s
      retries: 30

  mdm-migrate:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE}
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >-
        PGPASSWORD=mdm-e2e psql -h mdm-postgres -U mdm_user -d mdm_db
        --set ON_ERROR_STOP=1 --file /migrations/001_master_data.sql
    volumes:
      - ../../db/master-data-service/migrations:/migrations:ro
    networks: [mdm-data]
    depends_on:
      mdm-postgres:
        condition: service_healthy

  master-data-service:
    image: bpmp/e2e-ods-phase45:local
    build:
      context: ../..
      dockerfile: platform/e2e/Dockerfile.ods-phase45
    entrypoint: ["/usr/local/bin/master-data-service"]
    environment:
      MDM_SERVICE_ADDR: 0.0.0.0:8086
      MDM_POSTGRES_DSN: postgres://mdm_user:mdm-e2e@mdm-postgres:5432/mdm_db?sslmode=disable
      MDM_KAFKA_BROKERS: redpanda:9092
      MDM_KAFKA_TOPIC: bpmp.mdm.events.v1.e2e
      MDM_SERVER_CERTIFICATE: /runtime/secrets/tls.pem
      MDM_SERVER_PRIVATE_KEY: /runtime/secrets/tls-key.pem
