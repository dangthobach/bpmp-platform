  audit-projection:
    image: bpmp/e2e-ods-phase45:local
    build:
      context: ../..
      dockerfile: platform/e2e/Dockerfile.ods-phase45
    entrypoint: ["/usr/local/bin/audit-projection"]
    environment:
      AUDIT_PROJECTION_ADDR: 0.0.0.0:8087
      AUDIT_POSTGRES_DSN: postgres://audit_user:audit-e2e@audit-postgres:5432/audit_db?sslmode=disable
      AUDIT_KAFKA_BROKERS: redpanda:9092
      AUDIT_KAFKA_TOPICS: bpmp.case.events.v1.e2e,bpmp.document.events.v1.e2e,bpmp.integration.events.v1.e2e,bpmp.mdm.events.v1.e2e
      AUDIT_KAFKA_GROUP: bpmp.audit-projection.v1.e2e
      AUDIT_SERVER_CERTIFICATE: /runtime/secrets/tls.pem
      AUDIT_SERVER_PRIVATE_KEY: /runtime/secrets/tls-key.pem
      AUDIT_CLIENT_CA: /runtime/secrets/ca.pem
    volumes:
      - ./runtime:/runtime:ro
    networks: [default, audit-data]
    depends_on:
      audit-migrate:
        condition: service_completed_successfully
      case-topic-init:
        condition: service_completed_successfully
      ods-phase45-topic-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--cacert", "/runtime/secrets/ca.pem", "--cert", "/runtime/secrets/tls.pem", "--key", "/runtime/secrets/tls-key.pem", "--resolve", "api-gateway:8087:127.0.0.1", "https://api-gateway:8087/readyz"]
