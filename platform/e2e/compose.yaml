      context: ../..
      dockerfile: platform/e2e/Dockerfile.ods-dev
    command: ["npm", "run", "dev", "-w", "@ods/document-mfe", "--", "--host", "0.0.0.0"]
    ports:
      - "127.0.0.1:4305:4305"
    networks: [default]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4305/mf-manifest.json').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
