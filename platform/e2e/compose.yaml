        condition: service_completed_successfully
      ods-phase45-topic-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--cacert", "/runtime/secrets/ca.pem", "--cert", "/runtime/secrets/tls.pem", "--key", "/runtime/secrets/tls-key.pem", "--resolve", "api-gateway:8086:127.0.0.1", "https://api-gateway:8086/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30

  audit-postgres:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: audit_user
      POSTGRES_PASSWORD: audit-e2e
      POSTGRES_DB: audit_db
    networks: [audit-data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
