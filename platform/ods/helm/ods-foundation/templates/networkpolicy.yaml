{{- if .Values.networkPolicy.enabled }}
{{- range $component := list "shell" "task-mfe" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ods-foundation.fullname" $ }}-{{ $component }}
  labels:
    {{- include "ods-foundation.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $component }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        {{- range $selector := $.Values.networkPolicy.additionalIngressNamespaceSelectors }}
        - namespaceSelector:
            {{- toYaml $selector | nindent 12 }}
        {{- end }}
      ports:
        - {protocol: TCP, port: http}
{{- end }}
{{- end }}
