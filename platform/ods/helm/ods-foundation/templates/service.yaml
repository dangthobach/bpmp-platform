{{- range $component := list "shell" "task-mfe" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ods-foundation.fullname" $ }}-{{ $component }}
  labels:
    {{- include "ods-foundation.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $component }}
  ports:
    - {name: http, port: {{ $.Values.service.port }}, targetPort: http, protocol: TCP}
{{- end }}
