name: ODS Foundation

on:
  pull_request:
    paths:
      - ".github/workflows/ods-foundation.yml"
      - "apps/go/api-gateway/**"
      - "apps/go/authoring-service/**"
      - "apps/go/human-runtime/**"
      - "apps/rust/bpmn-compiler/**"
      - "apps/rust/bpmp-engine-server/**"
      - "apps/web/cockpit-web/**"
      - "apps/web/ods-shell/**"
      - "apps/web/task-mfe/**"
      - "contracts/proto/**"
      - "db/authoring-service/**"
      - "db/human-runtime/**"
      - "packages/frontend/**"
      - "platform/ods/**"
      - "platform/authoring/**"
      - "tools/check-ods-frontend-boundaries.mjs"
      - "tools/bpmp-e2e-fixtures/**"
      - "tools/verify-ods-catalog.mjs"
      - "platform/e2e/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.ods.json"
  push:
    branches: ["main"]
    tags: ["ods-v*"]

permissions:
  contents: read

concurrency:
  group: ods-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - name: Boundaries, types, tests and production builds
        run: npm run verify:ods
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Federation and failure-isolation E2E
        run: npm run test:ods-e2e
      - uses: actions/upload-artifact@v4
        with:
          name: ods-frontend-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: |
            apps/web/ods-shell/dist
            apps/web/task-mfe/dist

  gateway-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.12
          cache-dependency-path: |
            go.work.sum
            apps/go/api-gateway/go.sum
      - run: go vet ./apps/go/api-gateway/...
      - run: go test -race ./apps/go/api-gateway/...

  authoring-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: bpmp
          POSTGRES_PASSWORD: bpmp-test
          POSTGRES_DB: authoring_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bpmp -d authoring_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTHORING_POSTGRES_DSN: postgres://bpmp:bpmp-test@localhost:5432/authoring_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.12
          cache-dependency-path: go.work.sum
      - run: go vet ./apps/go/authoring-service/...
      - run: go test -race ./apps/go/authoring-service/...

  task-runtime-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: bpmp
          POSTGRES_PASSWORD: bpmp-test
          POSTGRES_DB: human_runtime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bpmp -d human_runtime_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HUMAN_RUNTIME_POSTGRES_DSN: postgres://bpmp:bpmp-test@localhost:5432/human_runtime_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.25.12
          cache-dependency-path: go.work.sum
      - run: go vet ./apps/go/human-runtime/...
      - run: go test -race ./apps/go/human-runtime/...

  platform-e2e:
    needs: [container-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Run broker-backed platform E2E
        shell: pwsh
        run: ./platform/e2e/run.ps1

  cockpit-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web/cockpit-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: apps/web/cockpit-web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test

  deployment-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
      - uses: azure/setup-helm@v4
        with:
          version: v3.13.1
      - name: Verify signed catalog fixture
        run: npm run test:ods-release
      - name: Lint and render digest-only release
        run: |
          helm lint platform/ods/helm/ods-foundation -f platform/ods/helm/ods-foundation/ci/values.yaml
          rendered="$(helm template ods platform/ods/helm/ods-foundation -f platform/ods/helm/ods-foundation/ci/values.yaml)"
          test "$(grep -c '^kind: HorizontalPodAutoscaler$' <<< "$rendered")" -eq 2
          test "$(grep -c '^kind: NetworkPolicy$' <<< "$rendered")" -eq 2
          grep -q 'topologyKey: "topology.kubernetes.io/zone"' <<< "$rendered"
          grep -q 'topologyKey: "kubernetes.io/hostname"' <<< "$rendered"
          if helm lint platform/ods/helm/ods-foundation -f platform/ods/helm/ods-foundation/ci/values.yaml --set shell.image.digest=latest; then
            echo "mutable image reference unexpectedly passed"
            exit 1
          fi
          if helm template ods platform/ods/helm/ods-foundation -f platform/ods/helm/ods-foundation/ci/values.yaml --set autoscaling.minReplicas=5 --set autoscaling.maxReplicas=2; then
            echo "invalid autoscaling range unexpectedly passed"
            exit 1
          fi
          helm lint platform/authoring/helm/authoring-service -f platform/authoring/helm/authoring-service/ci/values.yaml
          authoring_rendered="$(helm template authoring platform/authoring/helm/authoring-service -f platform/authoring/helm/authoring-service/ci/values.yaml)"
          grep -q 'image: "ghcr.io/example/bpmp-platform/authoring-service@sha256:' <<< "$authoring_rendered"
          authoring_policy_rendered="$(helm template authoring platform/authoring/helm/authoring-service -f platform/authoring/helm/authoring-service/ci/values.yaml -f platform/authoring/helm/authoring-service/ci/networkpolicy-values.yaml)"
          test "$(grep -c '^kind: NetworkPolicy$' <<< "$authoring_policy_rendered")" -eq 2
          migration_rendered="$(helm template authoring platform/authoring/helm/authoring-service -f platform/authoring/helm/authoring-service/ci/values.yaml --set migration.enabled=true)"
          grep -q -- '--migrate-only' <<< "$migration_rendered"
          if helm lint platform/authoring/helm/authoring-service -f platform/authoring/helm/authoring-service/ci/values.yaml --set image.digest=latest; then
            echo "mutable Authoring image reference unexpectedly passed"
            exit 1
          fi
          if helm template authoring platform/authoring/helm/authoring-service -f platform/authoring/helm/authoring-service/ci/values.yaml --set autoscaling.enabled=true --set autoscaling.minReplicas=5 --set autoscaling.maxReplicas=2; then
            echo "invalid Authoring autoscaling range unexpectedly passed"
            exit 1
          fi
          if helm lint platform/authoring/helm/authoring-service -f platform/authoring/helm/authoring-service/ci/values.yaml --set networkPolicy.enabled=true; then
            echo "empty Authoring NetworkPolicy unexpectedly passed"
            exit 1
          fi

  container-images:
    needs: [frontend-quality, deployment-quality, authoring-quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: ods-shell
            dockerfile: platform/ods/Dockerfile.ods-shell
          - app: task-mfe
            dockerfile: platform/ods/Dockerfile.task-mfe
          - app: authoring-service
            dockerfile: platform/ods/Dockerfile.authoring-service
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR
        if: startsWith(github.ref, 'refs/tags/ods-v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and optionally publish immutable image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ startsWith(github.ref, 'refs/tags/ods-v') }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.app }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
      - name: Attest published image
        if: startsWith(github.ref, 'refs/tags/ods-v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}/${{ matrix.app }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
