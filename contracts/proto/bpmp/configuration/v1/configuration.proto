syntax = "proto3";

package bpmp.configuration.v1;

// Immutable protocol values. Runtime policy belongs in EnginePolicy.
enum ConfigurationScopeType {
  CONFIGURATION_SCOPE_TYPE_UNSPECIFIED = 0;
  CONFIGURATION_SCOPE_TYPE_PLATFORM = 1;
  CONFIGURATION_SCOPE_TYPE_ENVIRONMENT = 2;
  CONFIGURATION_SCOPE_TYPE_TENANT = 3;
  CONFIGURATION_SCOPE_TYPE_WORKFLOW_TYPE = 4;
  CONFIGURATION_SCOPE_TYPE_WORKFLOW_VERSION = 5;
  CONFIGURATION_SCOPE_TYPE_APPROVED_INSTANCE_OVERRIDE = 6;
}

enum ConfigurationOwner {
  CONFIGURATION_OWNER_UNSPECIFIED = 0;
  CONFIGURATION_OWNER_ENGINE = 1;
  CONFIGURATION_OWNER_API_GATEWAY = 2;
  CONFIGURATION_OWNER_HUMAN_RUNTIME = 3;
  CONFIGURATION_OWNER_PROJECTION = 4;
  CONFIGURATION_OWNER_GOVERNANCE = 5;
  CONFIGURATION_OWNER_CONFIGURATION_SERVICE = 6;
  CONFIGURATION_OWNER_COCKPIT_GATEWAY = 7;
  CONFIGURATION_OWNER_AUTHZ_CONTROL_PLANE = 8;
}

enum ConfigurationPublicationKind {
  CONFIGURATION_PUBLICATION_KIND_UNSPECIFIED = 0;
  CONFIGURATION_PUBLICATION_KIND_PUBLISHED = 1;
  CONFIGURATION_PUBLICATION_KIND_ROLLED_BACK = 2;
  CONFIGURATION_PUBLICATION_KIND_RETIRED = 3;
  CONFIGURATION_PUBLICATION_KIND_RESTORED = 4;
}

message ConfigurationScope {
  ConfigurationScopeType type = 1;
  string reference = 2;
}

message RetryPolicy {
  uint32 max_attempts = 1;
  uint64 initial_backoff_ms = 2;
  uint64 max_backoff_ms = 3;
  uint32 multiplier_millis = 4;
}

message EnginePolicy {
  uint32 snapshot_interval_events = 1;
  uint32 max_events_per_decision = 2;
  uint64 command_timeout_ms = 3;
  RetryPolicy optimistic_conflict_retry = 4;
  LocalWasmPolicy local_wasm = 5;
  string authorization_audit_key_scope = 6;
  uint32 max_multi_instance_cardinality = 7;
  uint32 default_multi_instance_parallelism = 8;
  BoundaryRuntimePolicy boundary_runtime = 9;
  string event_payload_key_scope = 10;
  EngineWorkerPolicy workers = 11;
}

message EngineWorkerPolicy {
  uint64 poll_interval_ms = 1;
  uint32 outbox_batch_size = 2;
  RetryPolicy outbox_retry = 3;
  uint32 local_task_batch_size = 4;
  RetryPolicy local_task_retry = 5;
  RemoteWorkerPolicy remote = 6;
}

message RemoteWorkerPolicy {
  uint32 dispatch_batch_size = 1;
  uint32 max_workers = 2;
  uint32 max_credit_per_worker = 3;
  uint32 max_capabilities_per_worker = 4;
  uint64 lease_duration_ms = 5;
  uint64 heartbeat_timeout_ms = 6;
  uint32 max_identifier_bytes = 7;
  uint32 max_protocol_version_bytes = 8;
  uint32 stream_channel_capacity = 9;
  uint32 max_input_bytes = 10;
  uint32 max_output_bytes = 11;
  uint32 max_attempts = 12;
  uint64 retry_delay_ms = 13;
}

message BoundaryRuntimePolicy {
  uint32 projection_batch_size = 1;
  uint32 dispatch_batch_size = 2;
  uint32 max_dispatch_attempts = 3;
  uint64 retry_delay_ms = 4;
  uint64 lease_duration_ms = 5;
  uint64 max_timer_horizon_ms = 6;
  uint32 max_expression_bytes = 7;
  string worker_id = 8;
  uint32 max_signal_id_bytes = 9;
  uint32 max_reference_bytes = 10;
  uint32 max_subscriptions_per_instance = 11;
}

message LocalWasmPolicy {
  uint64 max_module_bytes = 1;
  uint64 max_input_bytes = 2;
  uint64 max_output_bytes = 3;
  uint64 max_memory_bytes = 4;
  uint64 max_wasm_stack_bytes = 5;
  uint32 max_table_elements = 6;
  uint32 max_instances = 7;
  uint32 max_tables = 8;
  uint32 max_memories = 9;
  uint64 fuel = 10;
}

message ApiGatewayPolicy {
  uint32 rate_limit_requests = 1;
  uint64 rate_limit_window_ms = 2;
  uint64 upstream_timeout_ms = 3;
  uint32 circuit_breaker_failure_threshold = 4;
  uint64 circuit_breaker_open_ms = 5;
  uint32 bulkhead_max_concurrency = 6;
  uint64 max_request_body_bytes = 7;
  uint64 max_upstream_response_bytes = 8;
  uint32 batch_chunk_size = 9;
  uint32 batch_concurrency = 10;
  RetryPolicy upstream_retry = 11;
  string encryption_key_scope = 12;
}

message HumanRuntimePolicy {
  uint32 projection_batch_size = 1;
  uint32 escalation_batch_size = 2;
  uint64 escalation_lease_ms = 3;
  uint64 escalation_retry_ms = 4;
  uint64 escalation_poll_ms = 5;
  uint64 engine_command_timeout_ms = 6;
  uint32 max_assignment_candidates = 7;
  uint32 max_delegation_depth = 8;
  uint32 query_default_page_size = 9;
  uint32 query_max_page_size = 10;
  RetryPolicy engine_retry = 11;
  uint32 engine_circuit_breaker_failure_threshold = 12;
  uint64 engine_circuit_breaker_open_ms = 13;
  repeated string engine_retryable_codes = 14;
}

message ProjectionPolicy {
  uint32 consume_batch_size = 1;
  uint32 rebuild_batch_size = 2;
  uint32 query_default_page_size = 3;
  uint32 query_max_page_size = 4;
  uint32 realtime_publish_batch_size = 5;
  uint64 checkpoint_flush_ms = 6;
  uint64 max_projection_lag_ms = 7;
}

message GovernancePolicy {
  uint64 approval_ttl_ms = 1;
  uint64 fresh_authentication_max_age_ms = 2;
  uint64 kms_request_timeout_ms = 3;
  RetryPolicy kms_retry = 4;
  uint64 key_cache_ttl_ms = 5;
  uint64 revocation_barrier_timeout_ms = 6;
  uint32 reconciliation_batch_size = 7;
  uint32 max_pending_compensations = 8;
  string abort_capability = 9;
  repeated string accepted_auth_assurance = 10;
  repeated GovernanceApprovalKey approval_keys = 11;
  uint32 required_approver_count = 12;
}

message GovernanceApprovalKey {
  string key_id = 1;
  bytes ed25519_public_key = 2;
  bool enabled = 3;
}

message ConfigurationServicePolicy {
  uint32 outbox_batch_size = 1;
  uint64 outbox_lease_ms = 2;
  uint64 outbox_poll_ms = 3;
  RetryPolicy outbox_retry = 4;
  uint32 query_default_page_size = 5;
  uint32 query_max_page_size = 6;
  uint64 max_request_body_bytes = 7;
}

message CockpitGatewayPolicy {
  uint32 max_names_per_connection = 1;
  uint32 max_signal_names_bytes = 2;
  uint32 max_connections = 3;
  uint32 max_subscriptions = 4;
  uint32 outbound_buffer_size = 5;
  uint32 replay_size_per_stream = 6;
  uint32 max_replay_streams = 7;
  uint64 heartbeat_interval_ms = 8;
  uint32 consume_batch_size = 9;
  repeated string allowed_signal_names = 10;
  repeated string allowed_origins = 11;
}

message AuthzControlPlanePolicy {
  uint64 request_timeout_ms = 1;
  uint64 connect_timeout_ms = 2;
  uint32 http_pool_max_idle_per_host = 3;
  uint32 graph_max_depth = 4;
  uint64 graph_memo_capacity = 5;
  uint64 graph_memo_ttl_ms = 6;
  uint32 inactive_user_days = 7;
  uint32 inactive_user_batch_size = 8;
  uint64 inactive_user_poll_ms = 9;
  RetryPolicy inactive_user_retry = 10;
}

message ResolvedConfigurationSnapshot {
  string config_id = 1;
  string config_version = 2;
  string policy_version = 3;
  uint32 schema_version = 4;
  repeated ConfigurationScope resolved_scopes = 5;
  bytes content_hash = 6;
  EnginePolicy engine = 7;
  ConfigurationOwner owner = 8;
  ApiGatewayPolicy api_gateway = 9;
  HumanRuntimePolicy human_runtime = 10;
  ProjectionPolicy projection = 11;
  GovernancePolicy governance = 12;
  uint64 ordinal = 13;
  ConfigurationServicePolicy configuration_service = 14;
  CockpitGatewayPolicy cockpit_gateway = 15;
  AuthzControlPlanePolicy authz_control_plane = 16;
}

message ResolveConfigurationRequest {
  string tenant_id = 1;
  string workflow_type = 2;
  string workflow_version = 3;
  string platform_reference = 4;
  string environment_reference = 5;
  string instance_id = 6;
  ConfigurationOwner owner = 7;
}

message ResolveConfigurationResponse {
  ResolvedConfigurationSnapshot snapshot = 1;
}

message ConfigurationPublicationEvent {
  uint32 schema_version = 1;
  string event_id = 2;
  uint64 event_sequence = 3;
  string tenant_id = 4;
  string profile_id = 5;
  string version_id = 6;
  string config_version = 7;
  string policy_version = 8;
  uint64 ordinal = 9;
  ConfigurationOwner owner = 10;
  ConfigurationScope scope = 11;
  bytes content_hash = 12;
  ConfigurationPublicationKind kind = 13;
  uint64 occurred_at_epoch_ms = 14;
  string workflow_type = 15;
  string workflow_version = 16;
  string instance_id = 17;
}

service ConfigurationResolverService {
  rpc ResolveConfiguration(ResolveConfigurationRequest) returns (ResolveConfigurationResponse);
}
