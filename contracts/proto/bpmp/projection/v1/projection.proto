syntax = "proto3";

package bpmp.projection.v1;

import "bpmp/authorization/v1/authorization.proto";

message WorkflowInstanceReadModel {
  string tenant_id = 1;
  string instance_id = 2;
  string workflow_type = 3;
  string workflow_version = 4;
  string status = 5;
  string active_node_id = 6;
  uint64 last_event_sequence = 7;
  uint64 started_at_epoch_ms = 8;
  uint64 updated_at_epoch_ms = 9;
  uint64 completed_at_epoch_ms = 10;
  string config_version = 11;
  string policy_version = 12;
  bool is_deleted = 13;
  uint64 version = 14;
  string initiator_actor_id = 15;
}

message GetWorkflowInstanceRequest {
  string tenant_id = 1;
  string instance_id = 2;
  bpmp.authorization.v1.ActorProof actor_proof = 3;
}

message GetWorkflowInstanceResponse {
  WorkflowInstanceReadModel instance = 1;
}

message ListWorkflowInstancesRequest {
  string tenant_id = 1;
  repeated string statuses = 2;
  string workflow_type = 3;
  bool include_deleted = 4;
  uint32 page_size = 5;
  string page_token = 6;
  bpmp.authorization.v1.ActorProof actor_proof = 7;
}

message ListWorkflowInstancesResponse {
  repeated WorkflowInstanceReadModel instances = 1;
  string next_page_token = 2;
}

enum LogicalOperator {
  LOGICAL_OPERATOR_UNSPECIFIED = 0;
  LOGICAL_OPERATOR_AND = 1;
  LOGICAL_OPERATOR_OR = 2;
}

enum ComparisonOperator {
  COMPARISON_OPERATOR_UNSPECIFIED = 0;
  COMPARISON_OPERATOR_EQUAL = 1;
  COMPARISON_OPERATOR_NOT_EQUAL = 2;
  COMPARISON_OPERATOR_GREATER_THAN = 3;
  COMPARISON_OPERATOR_GREATER_THAN_OR_EQUAL = 4;
  COMPARISON_OPERATOR_LESS_THAN = 5;
  COMPARISON_OPERATOR_LESS_THAN_OR_EQUAL = 6;
  COMPARISON_OPERATOR_IN = 7;
  COMPARISON_OPERATOR_NOT_IN = 8;
  COMPARISON_OPERATOR_CONTAINS = 9;
  COMPARISON_OPERATOR_STARTS_WITH = 10;
  COMPARISON_OPERATOR_IS_NULL = 11;
  COMPARISON_OPERATOR_IS_NOT_NULL = 12;
  COMPARISON_OPERATOR_ENDS_WITH = 13;
  COMPARISON_OPERATOR_BETWEEN = 14;
  COMPARISON_OPERATOR_NOT_BETWEEN = 15;
}

enum ProcessField {
  PROCESS_FIELD_UNSPECIFIED = 0;
  PROCESS_FIELD_INSTANCE_ID = 1;
  PROCESS_FIELD_WORKFLOW_TYPE = 2;
  PROCESS_FIELD_WORKFLOW_VERSION = 3;
  PROCESS_FIELD_STATUS = 4;
  PROCESS_FIELD_ACTIVE_NODE_ID = 5;
  PROCESS_FIELD_LAST_EVENT_SEQUENCE = 6;
  PROCESS_FIELD_STARTED_AT = 7;
  PROCESS_FIELD_UPDATED_AT = 8;
  PROCESS_FIELD_COMPLETED_AT = 9;
  PROCESS_FIELD_DURATION_MS = 10;
  PROCESS_FIELD_CONFIG_VERSION = 11;
  PROCESS_FIELD_POLICY_VERSION = 12;
  PROCESS_FIELD_VERSION = 13;
  PROCESS_FIELD_INITIATOR_ACTOR_ID = 14;
  PROCESS_FIELD_EVENT_COUNT = 15;
  PROCESS_FIELD_IS_DELETED = 16;
}

enum QueryScope {
  QUERY_SCOPE_UNSPECIFIED = 0;
  QUERY_SCOPE_ALL = 1;
  QUERY_SCOPE_ACTIVE = 2;
  QUERY_SCOPE_COMPLETED = 3;
  QUERY_SCOPE_DELETED = 4;
}

enum QueryValueKind {
  QUERY_VALUE_KIND_UNSPECIFIED = 0;
  QUERY_VALUE_KIND_STRING = 1;
  QUERY_VALUE_KIND_INTEGER = 2;
  QUERY_VALUE_KIND_BOOLEAN = 3;
  QUERY_VALUE_KIND_TIMESTAMP = 4;
}

enum EventField {
  EVENT_FIELD_UNSPECIFIED = 0;
  EVENT_FIELD_EVENT_TYPE = 1;
  EVENT_FIELD_NODE_ID = 2;
  EVENT_FIELD_ACTOR_ID = 3;
  EVENT_FIELD_SEQUENCE = 4;
  EVENT_FIELD_OCCURRED_AT = 5;
  EVENT_FIELD_CONFIG_VERSION = 6;
  EVENT_FIELD_POLICY_VERSION = 7;
}

enum SortDirection {
  SORT_DIRECTION_UNSPECIFIED = 0;
  SORT_DIRECTION_ASCENDING = 1;
  SORT_DIRECTION_DESCENDING = 2;
}

enum RelationQuantifier {
  RELATION_QUANTIFIER_UNSPECIFIED = 0;
  RELATION_QUANTIFIER_EXISTS = 1;
  RELATION_QUANTIFIER_NOT_EXISTS = 2;
}

enum TextTransform {
  TEXT_TRANSFORM_UNSPECIFIED = 0;
  TEXT_TRANSFORM_NONE = 1;
  TEXT_TRANSFORM_TRIM = 2;
  TEXT_TRANSFORM_LOWER = 3;
  TEXT_TRANSFORM_UPPER = 4;
  TEXT_TRANSFORM_TRIM_LOWER = 5;
  TEXT_TRANSFORM_TRIM_UPPER = 6;
}

enum NumericTransform {
  NUMERIC_TRANSFORM_UNSPECIFIED = 0;
  NUMERIC_TRANSFORM_NONE = 1;
  NUMERIC_TRANSFORM_ABS = 2;
}

enum DateTransform {
  DATE_TRANSFORM_UNSPECIFIED = 0;
  DATE_TRANSFORM_NONE = 1;
  DATE_TRANSFORM_UTC_DAY = 2;
  DATE_TRANSFORM_UTC_WEEK = 3;
  DATE_TRANSFORM_UTC_MONTH = 4;
  DATE_TRANSFORM_UTC_YEAR = 5;
}

message QueryValue {
  oneof value {
    string string_value = 1;
    sint64 integer_value = 2;
    bool boolean_value = 3;
    uint64 timestamp_epoch_ms = 4;
    string decimal_value = 5;
  }
}

message ProcessPredicate {
  ProcessField field = 1;
  ComparisonOperator operator = 2;
  repeated QueryValue values = 3;
  TextTransform text_transform = 4;
  QueryValue coalesce_value = 5;
  NumericTransform numeric_transform = 6;
  DateTransform date_transform = 7;
}

message EventPredicate {
  EventField field = 1;
  ComparisonOperator operator = 2;
  repeated QueryValue values = 3;
  TextTransform text_transform = 4;
  QueryValue coalesce_value = 5;
  NumericTransform numeric_transform = 6;
  DateTransform date_transform = 7;
}

message EventExpression {
  oneof expression {
    EventPredicate predicate = 1;
    EventExpressionGroup group = 2;
    EventExpression negated = 3;
  }
}

message EventExpressionGroup {
  LogicalOperator operator = 1;
  repeated EventExpression expressions = 2;
}

message EventRelationPredicate {
  EventExpression expression = 1;
  bool must_exist = 2 [deprecated = true];
  RelationQuantifier quantifier = 3;
}

message ProcessExpression {
  oneof expression {
    ProcessPredicate predicate = 1;
    ProcessExpressionGroup group = 2;
    ProcessExpression negated = 3;
    EventRelationPredicate event_relation = 4;
  }
}

message ProcessExpressionGroup {
  LogicalOperator operator = 1;
  repeated ProcessExpression expressions = 2;
}

message ProcessSort {
  ProcessField field = 1;
  SortDirection direction = 2;
  TextTransform text_transform = 3;
  QueryValue coalesce_value = 4;
  NumericTransform numeric_transform = 5;
  DateTransform date_transform = 6;
}

message QueryCompletedProcessesRequest {
  string tenant_id = 1;
  ProcessExpression filter = 2;
  repeated ProcessSort sort = 3;
  bool include_deleted = 4;
  uint32 page_size = 5;
  string page_token = 6;
  bpmp.authorization.v1.ActorProof actor_proof = 7;
  repeated ProcessField select = 8;
  ProcessField collapse = 9;
  EventExpansion expand_events = 10;
}

message CompletedProcessReadModel {
  WorkflowInstanceReadModel instance = 1;
  uint64 duration_ms = 2;
  uint64 event_count = 3;
  repeated string masked_fields = 4;
  repeated WorkflowEventReadModel events = 5;
}

message QueryCompletedProcessesResponse {
  repeated CompletedProcessReadModel processes = 1;
  string next_page_token = 2;
  repeated ProcessSort normalized_sort = 3;
  string policy_version = 4;
  string query_fingerprint = 5;
}

message QueryProcessesRequest {
  string tenant_id = 1;
  ProcessExpression filter = 2;
  repeated ProcessSort sort = 3;
  bool include_deleted = 4;
  uint32 page_size = 5;
  string page_token = 6;
  bpmp.authorization.v1.ActorProof actor_proof = 7;
  QueryScope scope = 8;
  repeated ProcessField select = 9;
  ProcessField collapse = 10;
  EventExpansion expand_events = 11;
}

message QueryProcessesResponse {
  repeated CompletedProcessReadModel processes = 1;
  string next_page_token = 2;
  repeated ProcessSort normalized_sort = 3;
  string policy_version = 4;
  string query_fingerprint = 5;
}

message EventExpansion {
  EventExpression filter = 1;
  uint32 limit = 2;
}

message WorkflowEventReadModel {
  string instance_id = 1;
  uint64 sequence = 2;
  string event_type = 3;
  string node_id = 4;
  string actor_id = 5;
  uint64 occurred_at_epoch_ms = 6;
  string config_version = 7;
  string policy_version = 8;
  bool is_deleted = 9;
  repeated string masked_fields = 10;
}

message EventSort {
  EventField field = 1;
  SortDirection direction = 2;
}

message QueryEventsRequest {
  string tenant_id = 1;
  EventExpression filter = 2;
  ProcessExpression process_filter = 3;
  repeated EventSort sort = 4;
  uint32 page_size = 5;
  string page_token = 6;
  bpmp.authorization.v1.ActorProof actor_proof = 7;
}

message QueryEventsResponse {
  repeated WorkflowEventReadModel events = 1;
  string next_page_token = 2;
  string policy_version = 3;
}

enum AggregateOperation {
  AGGREGATE_OPERATION_UNSPECIFIED = 0;
  AGGREGATE_OPERATION_COUNT = 1;
  AGGREGATE_OPERATION_SUM = 2;
  AGGREGATE_OPERATION_AVG = 3;
  AGGREGATE_OPERATION_MIN = 4;
  AGGREGATE_OPERATION_MAX = 5;
}

message AggregateMetric {
  string alias = 1;
  AggregateOperation operation = 2;
  ProcessField field = 3;
}

message AggregateProcessesRequest {
  string tenant_id = 1;
  QueryScope scope = 2;
  ProcessExpression filter = 3;
  repeated ProcessField group_by = 4;
  repeated AggregateMetric metrics = 5;
  uint32 limit = 6;
  bpmp.authorization.v1.ActorProof actor_proof = 7;
}

message AggregateCell {
  string name = 1;
  QueryValue value = 2;
}

message AggregateRow {
  repeated AggregateCell dimensions = 1;
  repeated AggregateCell metrics = 2;
}

message AggregateProcessesResponse {
  repeated AggregateRow rows = 1;
  string policy_version = 2;
}

message ProcessFieldCapability {
  ProcessField field = 1;
  QueryValueKind value_kind = 2;
  bool filterable = 3;
  bool sortable = 4;
  bool selectable = 5;
  repeated ComparisonOperator operators = 6;
  repeated TextTransform text_transforms = 7;
  repeated NumericTransform numeric_transforms = 8;
  repeated DateTransform date_transforms = 9;
}

message EventFieldCapability {
  EventField field = 1;
  QueryValueKind value_kind = 2;
  repeated ComparisonOperator operators = 3;
  repeated TextTransform text_transforms = 4;
  repeated NumericTransform numeric_transforms = 5;
  repeated DateTransform date_transforms = 6;
}

message GetQueryCapabilitiesRequest {
  string tenant_id = 1;
  bpmp.authorization.v1.ActorProof actor_proof = 2;
}

message GetQueryCapabilitiesResponse {
  string schema_version = 1;
  string config_version = 2;
  string policy_version = 3;
  repeated ProcessFieldCapability fields = 4;
  repeated EventFieldCapability event_fields = 5;
  uint32 default_page_size = 6;
  uint32 max_page_size = 7;
  uint32 max_filter_depth = 8;
  uint32 max_predicates = 9;
  uint32 max_sort_fields = 10;
  uint32 max_relation_joins = 11;
  uint32 max_in_values = 12;
  uint32 max_string_bytes = 13;
  repeated QueryScope scopes = 14;
  repeated ProcessSort default_sort = 15;
}

message SavedQuery {
  string id = 1;
  string name = 2;
  uint64 version = 3;
  QueryProcessesRequest query = 4;
  uint64 created_at_epoch_ms = 5;
  uint64 updated_at_epoch_ms = 6;
}

message SaveQueryRequest {
  string tenant_id = 1;
  string id = 2;
  string name = 3;
  uint64 expected_version = 4;
  QueryProcessesRequest query = 5;
  bpmp.authorization.v1.ActorProof actor_proof = 6;
}

message SaveQueryResponse { SavedQuery saved_query = 1; }
message ListSavedQueriesRequest { string tenant_id = 1; uint32 page_size = 2; string page_token = 3; bpmp.authorization.v1.ActorProof actor_proof = 4; }
message ListSavedQueriesResponse { repeated SavedQuery saved_queries = 1; string next_page_token = 2; }
message DeleteSavedQueryRequest { string tenant_id = 1; string id = 2; uint64 expected_version = 3; bpmp.authorization.v1.ActorProof actor_proof = 4; }
message DeleteSavedQueryResponse {}

enum QueryExportStatus {
  QUERY_EXPORT_STATUS_UNSPECIFIED = 0;
  QUERY_EXPORT_STATUS_PENDING = 1;
  QUERY_EXPORT_STATUS_COMPLETED = 2;
  QUERY_EXPORT_STATUS_FAILED = 3;
  QUERY_EXPORT_STATUS_CANCELLED = 4;
}

message QueryExport {
  string id = 1;
  QueryExportStatus status = 2;
  uint64 row_count = 3;
  bytes csv = 4;
  string error_code = 5;
  uint64 created_at_epoch_ms = 6;
  uint64 expires_at_epoch_ms = 7;
}

message CreateQueryExportRequest { string tenant_id = 1; QueryProcessesRequest query = 2; uint32 max_rows = 3; bpmp.authorization.v1.ActorProof actor_proof = 4; }
message CreateQueryExportResponse { QueryExport export = 1; }
message GetQueryExportRequest { string tenant_id = 1; string id = 2; bpmp.authorization.v1.ActorProof actor_proof = 3; }
message GetQueryExportResponse { QueryExport export = 1; }
message CancelQueryExportRequest { string tenant_id = 1; string id = 2; bpmp.authorization.v1.ActorProof actor_proof = 3; }
message CancelQueryExportResponse { QueryExport export = 1; }

message ExplainQueryPlanRequest { string tenant_id = 1; QueryProcessesRequest query = 2; bool analyze = 3; bpmp.authorization.v1.ActorProof actor_proof = 4; }
message ExplainQueryPlanResponse { string redacted_plan_json = 1; string query_fingerprint = 2; }

service ProjectionQueryService {
  rpc GetWorkflowInstance(GetWorkflowInstanceRequest) returns (GetWorkflowInstanceResponse);
  rpc ListWorkflowInstances(ListWorkflowInstancesRequest) returns (ListWorkflowInstancesResponse);
  rpc QueryCompletedProcesses(QueryCompletedProcessesRequest) returns (QueryCompletedProcessesResponse);
  rpc QueryProcesses(QueryProcessesRequest) returns (QueryProcessesResponse);
  rpc GetQueryCapabilities(GetQueryCapabilitiesRequest) returns (GetQueryCapabilitiesResponse);
  rpc AggregateProcesses(AggregateProcessesRequest) returns (AggregateProcessesResponse);
  rpc QueryEvents(QueryEventsRequest) returns (QueryEventsResponse);
  rpc SaveQuery(SaveQueryRequest) returns (SaveQueryResponse);
  rpc ListSavedQueries(ListSavedQueriesRequest) returns (ListSavedQueriesResponse);
  rpc DeleteSavedQuery(DeleteSavedQueryRequest) returns (DeleteSavedQueryResponse);
  rpc CreateQueryExport(CreateQueryExportRequest) returns (CreateQueryExportResponse);
  rpc GetQueryExport(GetQueryExportRequest) returns (GetQueryExportResponse);
  rpc CancelQueryExport(CancelQueryExportRequest) returns (CancelQueryExportResponse);
  rpc ExplainQueryPlan(ExplainQueryPlanRequest) returns (ExplainQueryPlanResponse);
}
