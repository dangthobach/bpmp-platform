syntax = "proto3";

package bpmp.authorization.v1;

enum ActorProofType {
  ACTOR_PROOF_TYPE_UNSPECIFIED = 0;
  ACTOR_PROOF_TYPE_ORIGINAL_JWT = 1;
  ACTOR_PROOF_TYPE_SIGNED_INTERNAL_CONTEXT = 2;
}

enum AuthorizationDecisionType {
  AUTHORIZATION_DECISION_TYPE_UNSPECIFIED = 0;
  AUTHORIZATION_DECISION_TYPE_ALLOW = 1;
  AUTHORIZATION_DECISION_TYPE_DENY = 2;
}

message ActorProof {
  ActorProofType type = 1;
  bytes signed_proof = 2;
}

message WorkloadProof {
  bytes signed_proof = 1;
}

message SignedActorContext {
  uint32 schema_version = 1;
  string tenant_id = 2;
  string actor_id = 3;
  repeated string roles = 4;
  repeated string capabilities = 5;
  uint64 revoke_epoch = 6;
  uint64 issued_at_epoch_ms = 7;
  uint64 expires_at_epoch_ms = 8;
  string audience_workload_id = 9;
  string command_id = 10;
  string signing_key_id = 11;
  bytes content_hash = 12;
  bytes signature = 13;
}

message SignedWorkloadContext {
  uint32 schema_version = 1;
  string tenant_id = 2;
  string workload_id = 3;
  string command_id = 4;
  uint64 issued_at_epoch_ms = 5;
  uint64 expires_at_epoch_ms = 6;
  string signing_key_id = 7;
  bytes content_hash = 8;
  bytes signature = 9;
}

message TransitionResource {
  string workflow_type = 1;
  string workflow_version = 2;
  string instance_id = 3;
  string active_node_id = 4;
  string action = 5;
  bytes resource_attributes_digest = 6;
}

message AuthorizationContext {
  string tenant_id = 1;
  string command_id = 2;
  string correlation_id = 3;
  uint64 evaluated_at_epoch_ms = 4;
  ActorProof actor_proof = 5;
  WorkloadProof workload_proof = 6;
  TransitionResource resource = 7;
}

message AuthorizationDecision {
  string decision_id = 1;
  AuthorizationDecisionType decision = 2;
  string deny_reason_code = 3;
  string actor_id = 4;
  repeated string roles = 5;
  repeated string capabilities = 6;
  string policy_version = 7;
  uint64 revoke_epoch = 8;
  uint64 decided_at_epoch_ms = 9;
  bytes actor_proof_digest = 10;
}

message AuthorizationAuditRecord {
  string decision_id = 1;
  string tenant_id = 2;
  string actor_id = 3;
  string workload_id = 4;
  string action = 5;
  string resource_ref = 6;
  AuthorizationDecisionType decision = 7;
  string deny_reason_code = 8;
  string policy_version = 9;
  uint64 revoke_epoch = 10;
  uint64 occurred_at_epoch_ms = 11;
  string command_id = 12;
  string correlation_id = 13;
  string workflow_type = 14;
  string workflow_version = 15;
  string instance_id = 16;
  string active_node_id = 17;
  repeated string roles = 18;
  string config_version = 19;
  uint64 bundle_sequence = 20;
  repeated string matched_grant_ids = 21;
  string resource_branch_id = 22;
  repeated string resource_branch_ancestry = 23;
  uint64 organization_version = 24;
}

enum AuthorizationPolicyEffect {
  AUTHORIZATION_POLICY_EFFECT_UNSPECIFIED = 0;
  AUTHORIZATION_POLICY_EFFECT_ALLOW = 1;
  AUTHORIZATION_POLICY_EFFECT_DENY = 2;
}

message AuthorizationPolicyGrant {
  string grant_id = 1;
  repeated string actor_ids = 2;
  repeated string roles = 3;
  repeated string required_capabilities = 4;
  string workflow_type = 5;
  string workflow_version = 6;
  string active_node_id = 7;
  string action = 8;
  AuthorizationPolicyEffect effect = 9;
  uint32 priority = 10;
}

message ActorRevokeEpoch {
  string actor_id = 1;
  uint64 revoke_epoch = 2;
}

message AuthorizationPolicyBundle {
  uint32 schema_version = 1;
  string tenant_id = 2;
  uint64 bundle_sequence = 3;
  string policy_version = 4;
  uint64 revoke_epoch = 5;
  uint64 valid_from_epoch_ms = 6;
  uint64 expires_at_epoch_ms = 7;
  repeated AuthorizationPolicyGrant grants = 8;
  repeated ActorRevokeEpoch actor_revoke_epochs = 9;
  string signing_key_id = 10;
  bytes content_hash = 11;
  bytes signature = 12;
  // Generic resource authorization is separate from workflow transition
  // grants; consumers must select the evaluator matching the resource owner.
  uint64 catalog_version = 13;
  repeated AuthorizationResourceGrant resource_grants = 14;
  repeated AuthorizationResourceDefinition resource_catalog = 15;
}

message AuthorizationResourceDefinition {
  string owner_id = 1;
  string manifest_version = 2;
  bytes manifest_digest = 3;
  string resource_type = 4;
  string action = 5;
  string capability = 6;
  repeated string supported_scope_types = 7;
  repeated string readable_fields = 8;
  repeated string writable_fields = 9;
}

// Kafka envelope around the already signed canonical policy bundle. Consumers
// treat bundle_bytes as untrusted and verify it before installing it locally.
message AuthorizationPolicyBundlePublication {
  string event_id = 1;
  string tenant_id = 2;
  uint64 bundle_sequence = 3;
  uint64 catalog_version = 4;
  uint64 published_at_epoch_ms = 5;
  bytes bundle_bytes = 6;
}

// Emitted by an evaluator only after it verifies and installs a publication.
// The Kafka producer identity is constrained by broker ACLs for the ack topic.
message AuthorizationPolicyBundleAcknowledgement {
  uint32 schema_version = 1;
  string acknowledgement_id = 2;
  string consumer_id = 3;
  string consumer_type = 4;
  string tenant_id = 5;
  uint64 bundle_sequence = 6;
  uint64 catalog_version = 7;
  bytes bundle_content_hash = 8;
  uint64 acknowledged_at_epoch_ms = 9;
}

message AuthorizationResourceGrant {
  string grant_id = 1;
  repeated string actor_ids = 2;
  repeated string roles = 3;
  repeated string required_capabilities = 4;
  string resource_type = 5;
  string action = 6;
  AuthorizationPolicyEffect effect = 7;
  uint32 priority = 8;
  // A branch ID applies to that branch and, when enabled, its descendants.
  repeated string branch_scope_ids = 9;
  bool branch_includes_descendants = 10;
  // A non-empty queue set is intersected with branch scope (AND semantics).
  repeated string queue_scope_ids = 11;
  // Empty means the resource owner may use its catalog's default field set.
  repeated string readable_fields = 12;
  repeated string writable_fields = 13;
  bool own_scope = 14;
  repeated string resource_scope_ids = 15;
  string owner_id = 16;
  // Tenant-wide access must be an explicit scope choice. It cannot be combined
  // with narrower branch, queue, owner, or resource scopes.
  bool tenant_scope = 17;
}

message AuthorizationRevokeEpochUpdate {
  uint32 schema_version = 1;
  string tenant_id = 2;
  string actor_id = 3;
  uint64 revoke_epoch = 4;
  uint64 bundle_sequence = 5;
  uint64 issued_at_epoch_ms = 6;
  string signing_key_id = 7;
  bytes content_hash = 8;
  bytes signature = 9;
}

message AuthorizationQueryRevokeEvent {
  uint32 schema_version = 1;
  string event_id = 2;
  string tenant_id = 3;
  string actor_id = 4;
  uint64 revoke_epoch = 5;
  uint64 event_sequence = 6;
  bool revoked = 7;
  uint64 occurred_at_epoch_ms = 8;
  string correlation_id = 9;
  string signing_key_id = 10;
  bytes content_hash = 11;
  bytes signature = 12;
}

message AuthorizationQueryRevokeDeadLetter {
  uint32 schema_version = 1;
  string incident_id = 2;
  string source_topic = 3;
  int32 source_partition = 4;
  int64 source_offset = 5;
  bytes source_sha256 = 6;
  uint64 source_size_bytes = 7;
  string reason_code = 8;
  uint64 quarantined_at_epoch_ms = 9;
}
