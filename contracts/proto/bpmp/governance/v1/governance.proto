syntax = "proto3";

package bpmp.governance.v1;

message AbortAndReconcileSpec {
  string tenant_id = 1;
  string instance_id = 2;
  string workflow_type = 3;
  string workflow_version = 4;
  string policy_id = 5;
  uint64 legal_deadline_epoch_ms = 6;
  string key_scope = 7;
  uint64 key_epoch = 8;
  string reason_code = 9;
}

message SignedApproval {
  bytes request_digest = 1;
  string tenant_id = 2;
  string actor_id = 3;
  string capability = 4;
  string auth_assurance = 5;
  uint64 approved_at_epoch_ms = 6;
  uint64 expires_at_epoch_ms = 7;
  string key_id = 8;
  bytes signature = 9;
}

message PrepareAbortAndReconcileRequest {
  AbortAndReconcileSpec spec = 1;
}

message PrepareAbortAndReconcileResponse {
  bytes request_digest = 1;
  bytes pending_ledger_digest = 2;
  uint64 expected_version = 3;
  string config_version = 4;
  string policy_version = 5;
}

message CommitAbortAndReconcileRequest {
  AbortAndReconcileSpec spec = 1;
  bytes pending_ledger_digest = 2;
  uint64 expected_version = 3;
  string command_id = 4;
  string idempotency_key = 5;
  string correlation_id = 6;
  uint64 evaluated_at_epoch_ms = 7;
  uint64 occurred_at_epoch_ms = 8;
  SignedApproval requester = 9;
  repeated SignedApproval approvers = 10;
}

message CommitAbortAndReconcileResponse {
  string command_id = 1;
  uint64 committed_sequence = 2;
  bool duplicate = 3;
  bytes request_digest = 4;
}

service EngineGovernanceService {
  rpc PrepareAbortAndReconcile(PrepareAbortAndReconcileRequest)
      returns (PrepareAbortAndReconcileResponse);
  rpc CommitAbortAndReconcile(CommitAbortAndReconcileRequest)
      returns (CommitAbortAndReconcileResponse);
}

enum ApprovalRole {
  APPROVAL_ROLE_UNSPECIFIED = 0;
  APPROVAL_ROLE_REQUESTER = 1;
  APPROVAL_ROLE_APPROVER = 2;
}

enum ApprovalRequestStatus {
  APPROVAL_REQUEST_STATUS_UNSPECIFIED = 0;
  APPROVAL_REQUEST_STATUS_PENDING = 1;
  APPROVAL_REQUEST_STATUS_APPROVED = 2;
  APPROVAL_REQUEST_STATUS_COMMITTED = 3;
  APPROVAL_REQUEST_STATUS_KEY_SHRED_PENDING = 4;
  APPROVAL_REQUEST_STATUS_COMPLETED = 5;
  APPROVAL_REQUEST_STATUS_REJECTED = 6;
}

message CreateApprovalRequest {
  string request_id = 1;
  string idempotency_key = 2;
  AbortAndReconcileSpec spec = 3;
  uint64 created_at_epoch_ms = 4;
}

message RecordApprovalRequest {
  string tenant_id = 1;
  string request_id = 2;
  ApprovalRole role = 3;
  SignedApproval approval = 4;
}

message SubmitApprovalRequest {
  string tenant_id = 1;
  string request_id = 2;
  string command_id = 3;
  string idempotency_key = 4;
  string correlation_id = 5;
  uint64 submitted_at_epoch_ms = 6;
}

message GetApprovalRequest {
  string tenant_id = 1;
  string request_id = 2;
}

message ApprovalRequestView {
  string request_id = 1;
  AbortAndReconcileSpec spec = 2;
  bytes request_digest = 3;
  bytes pending_ledger_digest = 4;
  uint64 expected_version = 5;
  string config_version = 6;
  string policy_version = 7;
  ApprovalRequestStatus status = 8;
  repeated SignedApproval requester_approvals = 9;
  repeated SignedApproval approver_approvals = 10;
  uint64 version = 11;
  uint64 created_at_epoch_ms = 12;
  uint64 updated_at_epoch_ms = 13;
  string committed_command_id = 14;
  uint64 committed_sequence = 15;
  string last_error = 16;
}

message CreateApprovalResponse {
  ApprovalRequestView approval = 1;
}

message RecordApprovalResponse {
  ApprovalRequestView approval = 1;
}

message SubmitApprovalResponse {
  ApprovalRequestView approval = 1;
}

message GetApprovalResponse {
  ApprovalRequestView approval = 1;
}

service GovernanceApprovalService {
  rpc CreateApproval(CreateApprovalRequest) returns (CreateApprovalResponse);
  rpc RecordApproval(RecordApprovalRequest) returns (RecordApprovalResponse);
  rpc SubmitApproval(SubmitApprovalRequest) returns (SubmitApprovalResponse);
  rpc GetApproval(GetApprovalRequest) returns (GetApprovalResponse);
}
