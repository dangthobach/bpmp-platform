syntax = "proto3";

package bpmp.raft.v1;

import "bpmp/engine/v1/engine.proto";

message AppendEntriesRequest {
  uint32 schema_version = 1;
  uint64 source_node_id = 2;
  bytes payload_json = 3;
}

message AppendEntriesResponse {
  uint32 schema_version = 1;
  bytes payload_json = 2;
}

message VoteRequest {
  uint32 schema_version = 1;
  uint64 source_node_id = 2;
  bytes payload_json = 3;
}

message VoteResponse {
  uint32 schema_version = 1;
  bytes payload_json = 2;
}

message InstallSnapshotRequest {
  uint32 schema_version = 1;
  uint64 source_node_id = 2;
  bytes payload_json = 3;
}

message InstallSnapshotResponse {
  uint32 schema_version = 1;
  bytes payload_json = 2;
}

message ForwardCommandRequest {
  uint32 schema_version = 1;
  uint32 hop_count = 2;
  bpmp.engine.v1.CommandEnvelope command = 3;
}

message ForwardCommandResponse {
  bpmp.engine.v1.CommandReceipt receipt = 1;
}

message AddLearnerRequest {
  uint32 schema_version = 1;
  uint64 node_id = 2;
  string raft_address = 3;
  bool blocking = 4;
}

message ChangeMembershipRequest {
  uint32 schema_version = 1;
  repeated uint64 voter_node_ids = 2;
  bool retain_removed_as_learners = 3;
}

message AddLearnerResponse {
  uint32 schema_version = 1;
  uint64 log_index = 2;
  optional uint64 leader_id = 3;
  optional string leader_address = 4;
}

message ChangeMembershipResponse {
  uint32 schema_version = 1;
  uint64 log_index = 2;
  optional uint64 leader_id = 3;
  optional string leader_address = 4;
}

service RaftPeerService {
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc Vote(VoteRequest) returns (VoteResponse);
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
  rpc ForwardCommand(ForwardCommandRequest) returns (ForwardCommandResponse);
  rpc AddLearner(AddLearnerRequest) returns (AddLearnerResponse);
  rpc ChangeMembership(ChangeMembershipRequest) returns (ChangeMembershipResponse);
}
